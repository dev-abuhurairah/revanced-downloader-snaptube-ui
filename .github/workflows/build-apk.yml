name: Build VidSnap Downloader APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          set -o pipefail
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle_build.log
          else
            ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle_build.log
          fi

      - name: Report Build Diagnostics on Failure
        if: failure()
        run: |
          echo "## ❌ Gradle Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 100 gradle_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Gradle Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log
          retention-days: 2


      - name: Locate & Rename APK
        id: locate_apk
        run: |
          mkdir -p artifacts
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" artifacts/VidSnap-Downloader.apk
            echo "Found APK: $APK_PATH"
            echo "apk_exists=true" >> $GITHUB_OUTPUT
          else
            echo "No APK found!"
            echo "apk_exists=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        if: steps.locate_apk.outputs.apk_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VidSnap-Downloader-APK
          path: artifacts/VidSnap-Downloader.apk
          retention-days: 30

      - name: Create Release (Optional)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/VidSnap-Downloader.apk
          name: Release ${{ github.ref_name }}
          body: |
            ### 🚀 VidSnap Downloader APK Ready!
            - Download `VidSnap-Downloader.apk` below and install directly onto your Android device.
            - Supports Instagram Reels, YouTube, TikTok, Facebook, Twitter & more.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
